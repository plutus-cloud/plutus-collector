# Source: plutus-collector/templates/prometheus.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plutus-collector-prometheus
  labels:
    helm.sh/chart: plutus-collector-0.1.0
    app.kubernetes.io/name: plutus-collector
    app.kubernetes.io/instance: plutus-collector
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # Recreate: a ReadWriteOnce volume cannot be mounted by the old and new pod at once, and two
  # Prometheus processes must never share a TSDB directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plutus-collector
      app.kubernetes.io/instance: plutus-collector
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plutus-collector
        app.kubernetes.io/instance: plutus-collector
        app.kubernetes.io/component: prometheus
      annotations:
        checksum/config: cc8884b0ddc5f1a4b13a4bbffa1fcdf2359f1917644b4b608092f35db3b62bdb
    spec:
      serviceAccountName: plutus-collector-prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: mirror-pull
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: prometheus
          image: "registry.example.com/mirror/prometheus/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2"
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/data
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=16384MB
            - --web.listen-address=:9090
            - --web.enable-lifecycle=false
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: plutus-collector-prometheus
        - name: data
          persistentVolumeClaim:
            claimName: plutus-collector-prometheus
