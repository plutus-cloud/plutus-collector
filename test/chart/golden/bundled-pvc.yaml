# Source: plutus-collector/templates/opencost.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plutus-collector-opencost
  labels:
    helm.sh/chart: plutus-collector-0.1.0
    app.kubernetes.io/name: plutus-collector
    app.kubernetes.io/instance: plutus-collector
    app.kubernetes.io/component: opencost
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # Recreate: with a PVC (mode none) a second pod could not mount the volume during a rollout,
  # and a single OpenCost has no use for a surge.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plutus-collector
      app.kubernetes.io/instance: plutus-collector
      app.kubernetes.io/component: opencost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plutus-collector
        app.kubernetes.io/instance: plutus-collector
        app.kubernetes.io/component: opencost
    spec:
      serviceAccountName: plutus-collector-opencost
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: mirror-pull
      containers:
        - name: opencost
          image: "registry.example.com/mirror/opencost/opencost:1.121.3@sha256:4cdd173253e5abba048dfe2cfa968707a5b59d774157d5356940d0d923a6c281"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            runAsUser: 1001
          ports:
            - name: http
              containerPort: 9003
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 10m
              memory: 128Mi
          # OpenCost serves nothing, /healthz included, until it can reach its data source, and it
          # retries that for several minutes before giving up. The startup probe has to outlast
          # that, or the kubelet restarts it while it is still waiting for Prometheus.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 1
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 1
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 1
          env:
            - name: LOG_LEVEL
              value: info
            - name: API_PORT
              value: "9003"
            - name: INSTALL_NAMESPACE
              value: "plutus-collector"
            # Every allocation is labelled with this, and the pusher prefers a row's own cluster
            # over clusterName, so it has to be the same value.
            - name: CLUSTER_ID
              value: "prod-us-east-1"
            - name: CLOUD_COST_ENABLED
              value: "false"
            - name: CUSTOM_COST_ENABLED
              value: "false"
            - name: MCP_SERVER_ENABLED
              value: "false"
            - name: PROMETHEUS_SERVER_ENDPOINT
              value: "http://plutus-collector-prometheus.plutus-collector.svc.cluster.local:9090"
            - name: PROMETHEUS_QUERY_RESOLUTION_SECONDS
              value: "300"

