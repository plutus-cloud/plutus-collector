# Source: plutus-collector/templates/prometheus.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plutus-collector-prometheus
  labels:
    helm.sh/chart: plutus-collector-0.1.0
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: plutus-collector
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # Recreate: a ReadWriteOnce volume cannot be mounted by the old and new pod at once, and two
  # Prometheus processes must never share a TSDB directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: plutus-collector
  template:
    metadata:
      labels:
        helm.sh/chart: plutus-collector-0.1.0
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/instance: plutus-collector
        app.kubernetes.io/component: prometheus
        app.kubernetes.io/managed-by: Helm
      annotations:
        checksum/config: 5e107f11f23b9346b9135bc388fedb5e8ed90fe307277a671e4b18ec2a6d3df1
    spec:
      serviceAccountName: plutus-collector-prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: "quay.io/prometheus/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2"
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/data
            - --storage.tsdb.retention.time=4d
            - --storage.tsdb.retention.size=3276MB
            - --web.listen-address=:9090
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: plutus-collector-prometheus
        - name: data
          emptyDir:
            sizeLimit: 4Gi
