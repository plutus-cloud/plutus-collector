# Source: plutus-collector/templates/prometheus.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: plutus-collector-prometheus
  labels:
    helm.sh/chart: plutus-collector-0.1.0
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: plutus-collector
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/managed-by: Helm
data:
  prometheus.yml: |
    global:
      scrape_interval: 60s
    scrape_configs:
      - job_name: opencost
        # OpenCost's series carry the labels the allocation queries join on; keep them as exposed.
        honor_labels: true
        static_configs:
          - targets: ["plutus-collector-opencost.plutus-collector.svc.cluster.local:9003"]
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: "go_.*|process_.*|promhttp_.*|kubecost_http_.*"
            action: drop
      - job_name: kubelet-cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: "container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_fs_usage_bytes"
            action: keep
      # Persistent volume usage, from the kubelet's own metrics.
      - job_name: kubelet
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: "kubelet_volume_stats_used_bytes"
            action: keep
