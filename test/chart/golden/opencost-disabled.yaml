apiVersion: v1
kind: Pod
metadata:
  name: plutus-collector-preflight
  labels:
    helm.sh/chart: plutus-collector-0.1.0
    app.kubernetes.io/name: plutus-collector
    app.kubernetes.io/instance: plutus-collector
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: preflight
      image: "ghcr.io/plutus-cloud/plutus-collector:0.1.0"
      imagePullPolicy: IfNotPresent
      args: ["preflight"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
      env:
        - name: OPENCOST_URL
          value: "http://opencost.opencost.svc.cluster.local:9003"
        - name: CLUSTER_NAME
          value: "prod-us-east-1"
        - name: CATCH_UP_DAYS
          value: "3"
        - name: PROMETHEUS_MODE
          value: "external"
        - name: PROMETHEUS_URL
          value: "http://prometheus-server.monitoring.svc.cluster.local:80"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

