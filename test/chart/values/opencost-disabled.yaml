# An OpenCost the customer already runs. Nothing OpenCost- or Prometheus-related is rendered; the
# store URL is only where the preflight looks.
clusterName: prod-us-east-1
currency: USD
apiKey: test-api-key
opencost:
  enabled: false
  endpoint: http://opencost.opencost.svc.cluster.local:9003
prometheus:
  mode: external
  external:
    url: http://prometheus-server.monitoring.svc.cluster.local:80
