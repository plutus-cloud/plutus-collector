# A v1 values file kept as a regression input for the v1 translation shim. It must render
# exactly what v1-external-prometheus.v2-equivalent.yaml renders.
clusterName: "my-cluster"
currency: "USD"
imagePullSecrets:
  - name: plutus-collector-ghcr-pull
existingSecret: plutus-collector-api-key
existingSecretKey: api-key
plutusIngestUrl: "https://console.plutus-cloud.com/api/ingest/kubernetes-cost"
pushIntervalMinutes: 1440
opencost:
  enabled: true
  opencost:
    exporter:
      defaultClusterId: "my-cluster"
    prometheus:
      existingSecretName: plutus-collector-opencost-prometheus
      username_key: username
      password_key: password
      internal:
        enabled: false
      external:
        enabled: true
        url: "https://prometheus.example.com/api/prom"
    customPricing:
      enabled: true
      provider: custom
      costModel:
        description: "Bare metal"
        CPU: "0.003154"
        spotCPU: "0.003154"
        RAM: "0.000423"
        spotRAM: "0.000423"
        GPU: "0"
        storage: "0"
        zoneNetworkEgress: "0"
        regionNetworkEgress: "0"
        internetNetworkEgress: "0"
