# The same install written with v2 keys.
clusterName: "plutus-hetzner-app-box"
currency: "USD"
global:
  imagePullSecrets:
    - name: plutus-collector-ghcr-pull
existingSecret: plutus-collector-api-key
existingSecretKey: api-key
plutusIngestUrl: "https://console.plutus-cloud.com/api/ingest/kubernetes-cost"
pusher:
  pushIntervalMinutes: 1440
opencost:
  pricing:
    provider: custom
    custom:
      CPU: "0.003154"
      spotCPU: "0.003154"
      RAM: "0.000423"
      spotRAM: "0.000423"
      GPU: "0"
      storage: "0"
      zoneNetworkEgress: "0"
      regionNetworkEgress: "0"
      internetNetworkEgress: "0"
prometheus:
  mode: external
  external:
    url: "https://prometheus-prod-01-eu-west-0.grafana.net/api/prom"
    auth:
      type: basic
      existingSecret: plutus-collector-opencost-prometheus
      usernameKey: username
      passwordKey: password
