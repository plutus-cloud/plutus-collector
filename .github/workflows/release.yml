name: Build & publish

# Moved out of the plutus monorepo's build-images.yml when this component split into its own
# repo (see README's "Why a separate repo" — the short version: a customer installs this into
# their own cluster and needs to be able to read the source, which a private monorepo made
# impossible even though the built artifacts were already public).
#
# Unlike plutus-backend/frontend/migrate in the main repo, this image AND chart are
# CUSTOMER-DISTRIBUTABLE: any customer's own cluster needs to `helm install` this with zero
# Plutus credentials. Both must be manually marked PUBLIC in GHCR's package settings after their
# first publish — `docker/build-push-action` and `helm push` don't set that themselves, and
# there's no API for it wired into this workflow.
#
# workflow_dispatch added for manual republishing (e.g. after a registry hiccup) without cutting
# a new release, same as the monorepo's build-images.yml.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing (Sigstore/Fulcio) exchanges this job's OIDC token for a
      # short-lived signing certificate — no signing key stored in this repo at all, and
      # nothing to rotate or leak. Needed for both signing steps below.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # No extra path segment (ghcr.io/${{ github.repository }} resolves to
      # ghcr.io/plutus-cloud/plutus-collector directly) — unlike the monorepo's images, this repo
      # builds exactly one artifact, so repo name and image name are the same thing.
      - name: Build & push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:main

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signs the exact digest just pushed (steps.build.outputs.digest), not the mutable tag —
      # a customer can then verify `ghcr.io/plutus-cloud/plutus-collector` is genuinely this
      # workflow's output, from this commit, before `helm install`ing it into their cluster:
      #   cosign verify ghcr.io/plutus-cloud/plutus-collector@<digest> \
      #     --certificate-identity-regexp 'https://github.com/plutus-cloud/plutus-collector/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign image (cosign, keyless)
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.4

      - name: Log Helm into GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # --version/--app-version pass the release tag straight through (e.g. "v0.1.0") rather than
      # Chart.yaml's own committed "0.1.0" placeholder — Helm's semver library accepts a leading
      # "v" and strips it, so no reformatting needed. `helm dependency update` fetches the
      # OpenCost subchart declared in Chart.yaml before packaging, so the published chart is
      # self-contained rather than depending on a customer's own `helm dependency update`
      # succeeding against opencost.github.io at install time. Pushed under a `charts/`
      # sub-segment so the chart's OCI package doesn't collide with the image's own package at
      # the bare repo path above.
      - name: Package & push Helm chart
        working-directory: ./chart
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          helm dependency update
          helm package . --version "$RELEASE_TAG" --app-version "$RELEASE_TAG"
          helm push "plutus-collector-$RELEASE_TAG.tgz" "oci://ghcr.io/plutus-cloud/charts"

      # cosign signs OCI artifacts generically, not just container images — pointing it at the
      # chart's tag reference resolves and signs the pushed chart's digest the same way as the
      # image above.
      - name: Sign Helm chart (cosign, keyless)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cosign sign --yes "ghcr.io/plutus-cloud/charts/plutus-collector:$RELEASE_TAG"

  # A CycloneDX SBOM for the image, attached to the GitHub Release — same reasoning as the
  # monorepo's build-images.yml: this component runs inside a customer's own infrastructure, so
  # its dependency inventory matters at least as much as anything Plutus runs for itself.
  # Separate job so no single job's token can both push images and rewrite the repo (`sbom` here
  # holds `packages: read` + `contents: write`, `build` above holds `packages: write` +
  # `contents: read` — never both at once).
  sbom:
    name: SBOM (CycloneDX)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      packages: read

    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # anchore/sbom-action does NOT create its output file's parent directory itself — confirmed
      # live, this exact job failed with ENOENT on v0.1.0's release before this line was added
      # (masked by continue-on-error: true, so nothing surfaced it until checked by hand).
      - run: mkdir -p sbom

      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom/plutus-collector-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach SBOM to the release
        if: github.event.release.tag_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" sbom/*.cdx.json \
            --clobber --repo "$REPOSITORY"
