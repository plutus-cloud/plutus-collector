name: Test

# This repo had no PR-time checks at all until it split out of the plutus monorepo (where
# `go build`/`go test`/`helm lint` were run by hand, not gated in CI) — closing that gap here
# rather than carrying it forward into the new repo.

on:
  pull_request:
  push:
    branches: [main]

# Neither job needs to write anything back to the repo or push a package — build/vet/test and
# helm lint only ever read the checked-out source — so GITHUB_TOKEN is scoped to read-only,
# same explicit-scoping convention as release.yml/security.yml/nightly.yml.
permissions:
  contents: read

jobs:
  go:
    name: go build / vet / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  chart:
    name: helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.4
      # helm lint needs the OpenCost subchart present to fully render, same as a real install —
      # helm dependency update pulls it fresh rather than vendoring the .tgz into git (see
      # ../.gitignore's chart/charts/ rule).
      - working-directory: ./chart
        run: |
          helm dependency update
          helm lint . --set clusterName=ci-test --set currency=USD --set apiKey=ci-test-key
