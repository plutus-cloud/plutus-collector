apiVersion: v2
name: plutus-collector
description: >-
  Installs the Plutus Kubernetes cost-allocation agent together with the OpenCost and Prometheus
  it reads from, so cost data starts flowing into Plutus with one `helm install` and nothing
  pre-installed. Point it at a Prometheus you already run with prometheus.mode=external.
type: application
# release.yml overwrites both with the release tag at package time.
version: 0.1.0
appVersion: "0.1.0"
home: https://plutus-cloud.com
sources:
  - https://github.com/plutus-cloud/plutus-collector
keywords:
  - finops
  - kubernetes
  - cost-allocation
  - opencost
maintainers:
  - name: Plutus
    url: https://plutus-cloud.com
