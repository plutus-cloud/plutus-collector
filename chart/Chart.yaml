apiVersion: v2
name: plutus-collector
description: >-
  Installs the Plutus Kubernetes cost-allocation pusher agent, plus (by default) OpenCost as a
  subchart, so cost data starts flowing into Plutus with one `helm install`. Set
  opencost.enabled=false and pusher.openCostUrl to point at an OpenCost instance you already run.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://plutus-cloud.com
sources:
  - https://github.com/plutus-cloud/plutus-collector
keywords:
  - finops
  - kubernetes
  - cost-allocation
  - opencost
maintainers:
  - name: Plutus
    url: https://plutus-cloud.com

dependencies:
  # Pinned to an exact version, with Chart.lock committed beside this file. A range here made
  # every release bundle whatever OpenCost chart was newest on the day it was cut, so the
  # OpenCost version (and with it the set of series the pusher's data depends on) could change
  # without any change in this repository. Bump deliberately, run `helm dependency update` and
  # commit the new Chart.lock together.
  - name: opencost
    version: "2.5.33"
    repository: "https://opencost.github.io/opencost-helm-chart"
    condition: opencost.enabled
