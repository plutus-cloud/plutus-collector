# plutus-collector Helm chart values (chart v2).
#
# This chart installs three things in your cluster: the pusher agent (this repository), OpenCost
# (which computes the costs) and, by default, one small Prometheus that OpenCost reads from. It
# does not use the upstream OpenCost or Prometheus charts: both are rendered from templates here
# so that one setting (clusterName, the metrics store) configures all of them consistently.
#
# values.schema.json validates this file at install time; an unknown key or a bad value fails
# `helm install` / `helm lint` with the reason rather than being ignored.

# --- Required, no default ------------------------------------------------------------------------
# Labels every pushed row and is OpenCost's cluster id (v1 needed it set twice).
clusterName: "" # e.g. "prod-us-east-1"
# ISO 4217 code OpenCost is priced in, e.g. "USD". Never defaulted: OpenCost does not report its
# own currency anywhere in its output, so guessing would silently mislabel every figure.
currency: ""

# --- API key -------------------------------------------------------------------------------------
# Mint a key in the Plutus UI (Cost Sources > Kubernetes > Generate API Key). Set exactly one of:
#   apiKey: pasted into a Secret this chart creates (the key then sits in Helm release history).
#   existingSecret + existingSecretKey: a Secret you manage yourself.
apiKey: ""
existingSecret: ""
existingSecretKey: "api-key"

plutusIngestUrl: "https://console.plutus-cloud.com/api/ingest/kubernetes-cost"

global:
  # Prefix for every image this chart pulls (a private mirror, an air-gapped registry), for
  # example "registry.example.com/mirror". Per-image `registry`/`repository` settings still apply.
  imageRegistry: ""
  imagePullSecrets: []

# --- The pusher ----------------------------------------------------------------------------------
pusher:
  image:
    repository: ghcr.io/plutus-cloud/plutus-collector
    # Empty uses the chart's appVersion, which release.yml sets to the release tag.
    tag: ""
    # sha256:... pins the image by digest; it takes precedence over the tag.
    digest: ""
    pullPolicy: IfNotPresent
  # A private CA to trust, in addition to the system roots, when reaching plutusIngestUrl: a
  # TLS-intercepting proxy or an internal gateway. A Secret you create with the PEM bundle under
  # `key`. Verification is never disabled.
  ingestCA:
    existingSecret: ""
    key: ca.crt
  schedule:
    # Once a day at this UTC time plus a random delay of up to jitterMinutes, and at startup.
    utcTime: "01:30"
    jitterMinutes: 20
  # Closed UTC days covered by each push, so a missed or empty day fills in once its inputs are
  # fixed. The metrics store must keep at least catchUpDays + 1 days.
  catchUpDays: 3
  # fail: a window with no cost rows is a fault (readiness 503, last_push_success 0, a warning
  #   in the log). A cluster always runs its own system pods, so a true zero means missing data.
  # ignore: treat it as normal.
  emptyResult: fail
  # Deprecated. When set (minutes) the agent uses a fixed interval counted from process start
  # instead of the daily schedule.
  pushIntervalMinutes: null
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      # No cpu limit: the pusher is idle almost all the time and does one short burst a day.
      memory: 64Mi

preflight:
  # Checks that the data behind OpenCost is there, at startup, before each push and every 5
  # minutes. Results go to /readyz, /metrics, the log and the heartbeat sent to Plutus.
  enabled: true
  # Check ids whose failure stops a push instead of only being reported. cluster_ambiguity
  # refuses to push when one metrics store holds several clusters and nothing tells them apart.
  blockPushOn:
    - cluster_ambiguity
  # `helm test <release>` runs the checks once and fails with the reason.
  helmTest: true

# --- OpenCost ------------------------------------------------------------------------------------
opencost:
  # false: use an OpenCost you already run, at `endpoint`. Nothing OpenCost-related is rendered
  # then, and prometheus.mode is only used to tell the preflight where to look.
  enabled: true
  endpoint: ""
  image:
    registry: ghcr.io
    repository: opencost/opencost
    tag: "1.121.3"
    # Resolved from the published multi-arch manifest list for 1.121.3 (amd64 and arm64).
    digest: "sha256:4cdd173253e5abba048dfe2cfa968707a5b59d774157d5356940d0d923a6c281"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 1Gi
  pricing:
    # auto: OpenCost detects the cloud provider and uses its price list. On a cluster it cannot
    #   identify (on-premises or bare metal) it falls back to built-in default rates, and the
    #   preflight warns about it.
    # custom: use the rates below.
    provider: auto
    custom:
      CPU: ""
      RAM: ""
      GPU: "0"
      storage: ""
      spotCPU: ""
      spotRAM: ""
      zoneNetworkEgress: "0"
      regionNetworkEgress: "0"
      internetNetworkEgress: "0"
  # Seconds between samples OpenCost's queries step over. Keep it at or above the scrape interval.
  queryResolutionSeconds: 300
  # The OpenCost UI and MCP server are not part of this chart.
  ui:
    enabled: false
  mcp:
    enabled: false
  extraEnv: []
  extraContainers: [] # e.g. an aws-sigv4-proxy sidecar for Amazon Managed Prometheus
  extraVolumes: []
  extraVolumeMounts: []
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # v1 chart only: values for the OpenCost subchart. Read for the keys listed in MIGRATING.md and
  # translated; any other key fails the install. Removed in the next minor release.
  opencost: {}

# --- Where OpenCost's data lives -------------------------------------------------------------------
prometheus:
  # bundled: one small Prometheus rendered by this chart, scraping OpenCost and the kubelet's
  #   cAdvisor endpoint. The default; needs nothing pre-installed.
  # external: a Prometheus-compatible store you run (Prometheus, Mimir, Thanos, Grafana Cloud).
  #   OpenCost's metrics (port 9003) must be scraped into it; see the README.
  # none: experimental. OpenCost's built-in collector data source, no Prometheus at all. It
  #   needs the nodes/proxy permission (see none.acknowledgeNodesProxy).
  mode: bundled
  bundled:
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.15.1
      # Resolved from the published multi-arch manifest list for v3.15.1.
      digest: "sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2"
      pullPolicy: IfNotPresent
    scrapeInterval: 60s
    # Must be at least pusher.catchUpDays + 1 days.
    retention: 4d
    storage:
      # emptyDir survives container restarts but not the pod being rescheduled, which loses
      # history (the preflight reports it). pvc keeps it, and the pod stays Pending on a cluster
      # with no default StorageClass.
      type: emptyDir
      size: 4Gi
      storageClass: ""
    scrapeCadvisor: true
    scrapeKubeletVolumeStats: true
    # How the bundled Prometheus verifies the kubelet when it scrapes container usage. It sends
    # its service account token to each node's kubelet, so an unverified connection lets anyone
    # who can intercept traffic between pods and nodes read that token and the metrics.
    #
    # The default is to skip verification because kubelet serving certificates are self-signed
    # on kubeadm and k3s clusters; verifying by default would make the scrape fail there and
    # silently drop usage metrics (costs fall back to requests only). Set insecureSkipVerify to
    # false where the kubelet certificates are signed by the cluster CA (check yours; the chart
    # cannot tell): the cluster CA mounted in every pod is then used. If they are signed by another CA, put its PEM in a Secret and name
    # it in caSecret.
    kubeletTLS:
      insecureSkipVerify: true
      caSecret: ""
      caKey: ca.crt
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
    nodeSelector: {}
    tolerations: []
    affinity: {}
  external:
    # Required when mode is external. The query API base: Prometheus's server root, Grafana
    # Cloud's .../api/prom, Mimir's .../prometheus.
    url: ""
    auth:
      type: none # none | basic | bearer | mtls
      existingSecret: ""
      usernameKey: username
      passwordKey: password
      tokenKey: token
      caKey: ca.crt
      certKey: tls.crt
      keyKey: tls.key
    tenantId: "" # X-Scope-OrgID for Mimir and Cortex
    insecureSkipVerify: false
    # Set when the store holds more than one cluster: the label that identifies the cluster,
    # whose values must equal clusterName. OpenCost then filters every query to this cluster.
    clusterLabel: ""
    serviceMonitor:
      # Renders a ServiceMonitor for OpenCost's metrics, only when the cluster has the
      # prometheus-operator CRD. Never required.
      enabled: false
      labels: {}
  none:
    # OpenCost's collector data source reads the kubelet through the API server's node proxy,
    # which needs the nodes/proxy permission. That permission can be used to run commands in any
    # pod on the node, so the chart renders it only when you set this to true.
    acknowledgeNodesProxy: false
    scrapeInterval: 30s
    storage:
      type: emptyDir
      size: 2Gi
      storageClass: ""

# --- Network policy ------------------------------------------------------------------------------
# Ingress policies for the components this chart renders, because the bundled Prometheus and
# OpenCost serve cluster-wide telemetry with no authentication. The Prometheus port accepts only
# OpenCost and the pusher; the OpenCost port accepts only the bundled Prometheus and the pusher.
# Egress is not restricted. Kubernetes only enforces NetworkPolicy when the cluster's network
# plugin does (Calico, Cilium and others do; flannel on its own does not), so on a cluster
# without enforcement this has no effect. With prometheus.mode=external the OpenCost policy is not
# rendered, because the scraper is yours and unknown; add a policy for it yourself.
networkPolicy:
  enabled: true
  # Extra NetworkPolicyIngressRule entries appended to both policies, for peers you add (for
  # example a scraper in another namespace). The pusher pod has no ingress policy.
  extraIngress: []

# --- The pusher pod --------------------------------------------------------------------------------
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

metricsPort: 9100
service:
  # A plain ClusterIP Service for /metrics and the probes, not a ServiceMonitor: the prometheus
  # operator is not assumed.
  enabled: true
  port: 9100

nameOverride: ""
fullnameOverride: ""

# --- Deprecated v1 keys (translated, removed in the next minor release; see MIGRATING.md) ----------
pushIntervalMinutes: null
imagePullSecrets: []
image: {}
resources: {}
