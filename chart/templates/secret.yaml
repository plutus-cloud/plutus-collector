{{/*
Only rendered when the user supplied the API key via values.apiKey directly rather than
pre-creating their own Secret (existingSecret). Never inline the key into a ConfigMap or
elsewhere — this is the one place it's allowed to exist as chart-managed cluster state, and even
then only because the user chose the "paste the key into values" convenience path over
existingSecret.
*/}}
{{- if not .Values.existingSecret }}
{{- if not .Values.apiKey }}
{{- fail "Either .Values.apiKey or .Values.existingSecret (+ existingSecretKey) must be set — see README's 'API key'." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plutus-collector.fullname" . }}
  labels:
    {{- include "plutus-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "plutus-collector.secretKey" . }}: {{ .Values.apiKey | quote }}
{{- end }}
